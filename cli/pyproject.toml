[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pfg"
version = "0.1.0"
description = "Partner onboarding and key management for partner-file-gateway"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["typer>=0.12", "boto3>=1.34", "httpx>=0.27", "cryptography>=42"]

[project.scripts]
pfg = "pfg.app:main"

[tool.setuptools.packages.find]
include = ["pfg*"]
