{% extends "base.html" %}
{% block title %}Transfers · partner-file-gateway{% endblock %}
{% block content %}
<section class="panel">
  <div class="panel-head">
    <h1>Transfers</h1>
    <form class="filters" method="get" action="/transfers">
      <label>Status
        <select name="status">
          <option value="">All</option>
          {% for status in statuses %}
          <option value="{{ status }}" {% if status == selected_status %}selected{% endif %}>{{ status|title }}</option>
          {% endfor %}
        </select>
      </label>
      <label>Partner
        <select name="partner">
          <option value="">All</option>
          {% for partner in partners %}
          <option value="{{ partner }}" {% if partner == selected_partner %}selected{% endif %}>{{ partner }}</option>
          {% endfor %}
        </select>
      </label>
      <button class="btn btn-secondary" type="submit">Filter</button>
    </form>
  </div>
  {% set refresh_url = "/transfers?status=" ~ (selected_status|urlencode) ~ "&partner=" ~ (selected_partner|urlencode) %}
  {% include "_transfer_table.html" %}
</section>
{% endblock %}
